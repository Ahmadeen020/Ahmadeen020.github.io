<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <title>Resume — Ahmad Abubakar Abbas</title>
  <style>
    :root{color-scheme:dark;--bg:#111310;--panel:#191c17;--text:#f0f1eb;--muted:#a4a99a;--accent:#c8f169;--line:#30352b}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{width:min(1100px,calc(100% - 40px));margin:auto}
    header{border-bottom:1px solid var(--line);padding:22px 0}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
    a{color:inherit;text-decoration:none}
    .logo{font-weight:800;font-size:23px;letter-spacing:-1px}.logo span{color:var(--accent)}
    .back{color:var(--muted);font-size:14px}.back:hover{color:var(--accent)}
    main{padding:48px 0 60px}
    .eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:700}
    h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.8px;margin:12px 0 8px}
    .sub{color:var(--muted);margin:0 0 26px;line-height:1.6}
    .viewer{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
    iframe{display:block;width:100%;height:min(82vh,1050px);min-height:600px;border:0;background:#fff}
    .fallback{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    .fallback a{color:var(--accent);text-decoration:underline}
    .download{display:flex;justify-content:center;margin:26px 0 0}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:#171a12;padding:14px 22px;border-radius:4px;font-weight:700;font-size:14px}
    .button:hover{filter:brightness(1.06)}
    footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}
    @media(max-width:600px){main{padding-top:34px}.wrap{width:min(100% - 28px,1100px)}iframe{height:72vh;min-height:480px}}
  </style>
</head>
<body>
  <header><div class="wrap top"><a class="logo" href="/">AA<span>.</span></a><a class="back" href="/">← Back to portfolio</a></div></header>
  <main class="wrap">
    <div class="eyebrow">PROFILE / RESUME</div>
    <h1>Ahmad Abubakar Abbas</h1>
    <p class="sub">View my CV below. You can download a copy after reviewing it.</p>
    <section class="viewer" aria-label="CV preview">
      <iframe src="/Ahmad_Abubakar_Abbas_CV.pdf" title="Ahmad Abubakar Abbas CV">
        Your browser does not support embedded PDF viewing.
      </iframe>
      <div class="fallback">If the preview does not appear, <a href="/Ahmad_Abubakar_Abbas_CV.pdf" target="_blank" rel="noreferrer">open the CV in a new tab</a>.</div>
    </section>
    <div class="download"><a class="button" href="/Ahmad_Abubakar_Abbas_CV.pdf" download="Ahmad_Abubakar_Abbas_CV.pdf">Download CV ↓</a></div>
  </main>
  <footer><div class="wrap">© 2026 Ahmad Abubakar Abbas</div></footer>
</body>
</html>
